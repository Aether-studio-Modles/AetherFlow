name: CI

# 正确性在云端跑，性能回归在**固定机器**上跑。
# 原因见 DESIGN.md 5.15：共享 runner 的抖动比 25% 的回归阈值还大，
# 把性能门禁放上去只会得到"时绿时红"的流水线，最后没人看。

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # 趋势采集要的是"连续"，不是"每次提交"：每天 18:00 UTC（北京次日 02:00）
    # 在固定机器上追加一轮，接上历史后按图名裁剪。
    - cron: "0 18 * * *"

jobs:
  lint:
    name: 静态检查（门槛规则）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 规则集在 pyproject.toml 的 [tool.ruff.lint] 里：只开 E9 + F（语法错误、
      # 未定义/未使用名）。风格类规则不进门禁，避免把正确性流水线变成格式争论。
      - name: 安装 ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ruff>=0.6"
      - name: ruff check
        run: python -m ruff check .

  cpu:
    name: 正确性（Python ${{ matrix.python }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          # torch 是可选依赖；不装时前端测试整组跳过，CUDA 组同理。
          python -m pip install numpy coverage
      - name: 单元测试（带覆盖率）
        run: python -m coverage run -m unittest discover -s tests -t .
      - name: 覆盖率报告
        run: python -m coverage report
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python }}
          path: .coverage
          if-no-files-found: ignore
      - name: 参考后端一致性报告
        run: |
          python - <<'PY'
          from aetherflow import ReferenceBackend, run_conformance
          report = run_conformance(ReferenceBackend())
          print(report.text())
          assert report.ok, "参考后端未通过一致性检查"
          PY

  frontend:
    name: 前端（torch ${{ matrix.torch }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 矩阵的两端各钉一次：区间内其余版本只有声明，没有逐版本回归（见 compat.py）。
        torch: ["2.9.*", "2.13.*"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装 torch（CPU wheel）
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy "torch==${{ matrix.torch }}" \
            --index-url https://download.pytorch.org/whl/cpu
      # torchvision 是可选依赖：没装时真实模型用例自动跳过，其余对拍照跑。
      - name: 前端适配器测试
        run: python -m unittest tests.test_frontend -v

  build:
    name: 打包（wheel + 安装冒烟）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: 安装构建工具
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
      # 打包失败要在标签前暴露：装不上比跑得慢更难发现。
      - name: 构建 sdist 与 wheel
        run: python -m build
      # 必须带上依赖（numpy）：`--no-deps` 装出来的 wheel 在干净环境里连
      # `import aetherflow` 都过不去，那不是打包坏了，是冒烟条件写错了。
      # 同时要离开仓库根执行：cwd 会被 Python 放进 sys.path[0]，在仓库根
      # 跑 `import aetherflow` 命中的是源码目录，wheel 根本没被验证。
      - name: 装进干净目录并冒烟
        run: |
          python -m pip install --target /tmp/af_site dist/*.whl
          cd /tmp && PYTHONPATH=/tmp/af_site python -c "
          import aetherflow
          from aetherflow.runtime import write_trace
          assert aetherflow.__file__.startswith('/tmp/af_site'), aetherflow.__file__
          print('import ok', aetherflow.__file__)
          "
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  fuzz:
    name: 模糊测试（IR 差分）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
      # 种子固定、无随机状态：失败时按日志里的 seed 用 --start N --iterations 1 复现。
      - name: 200 个随机种子
        run: python -m aetherflow.fuzz --iterations 200

  gpu-correctness:
    name: GPU 正确性（CUDA，固定节奏）
    # 需要一台装有 NVIDIA 驱动、CUDA 12.x 与 cupy 的自托管 runner，标签为 [self-hosted, gpu]。
    # 节奏固定为"main 的每次 push + 每日定时 + 手动"：正确性用例不测吞吐，机器被别的
    # 任务占着也只会变慢，不会误报；性能门禁单独放在 gpu-perf，只跟定时/手动走。
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event_name == 'schedule'
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: [self-hosted, gpu]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 环境自检
        run: |
          python -c "import cupy; print('cupy', cupy.__version__, '| runtime', cupy.cuda.runtime.runtimeGetVersion())"
          python verify_cuda.py
      - name: 单元测试（含 CUDA 组）
        run: python -m unittest discover -s tests -t . -v
      - name: CUDA 一致性报告
        run: |
          python - <<'PY'
          from aetherflow import run_conformance
          from aetherflow.backends.cuda import CudaBackend
          report = run_conformance(CudaBackend())
          print(report.text())
          assert report.ok, "CUDA 后端未通过一致性检查"
          PY

  hip:
    name: HIP 正确性（ROCm，固定节奏）
    # 需要一台装有 ROCm、能访问 /dev/kfd 与 /dev/dri 的 runner，标签为 [self-hosted, hip]。
    # 跨厂商一致性是本项目唯一不可外包的结论，只在手动触发时验证等于平时没有验证，
    # 所以与 CUDA 同节奏跑每日定时。
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: [self-hosted, hip]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: 环境自检
        run: |
          python -c "
          from aetherflow.backends.hip import HIP_AVAILABLE, HipBackend
          assert HIP_AVAILABLE, 'ROCm 不可用：检查 runner 的设备挂载与驱动'
          HipBackend()
          print('hip backend ok')
          "
      - name: 单元测试（含 HIP 组）
        run: python -m unittest discover -s tests -t .
      - name: HIP 一致性报告
        run: |
          python - <<'PY'
          from aetherflow import run_conformance
          from aetherflow.backends.hip import HipBackend
          report = run_conformance(HipBackend())
          print(report.text())
          assert report.ok, "HIP 后端未通过一致性检查"
          PY

  gpu-perf:
    name: GPU 性能回归（CUDA，定时）
    # 与 gpu-correctness 同一台机器，但只跑基准与趋势：性能数字对机器状态敏感
    # （DESIGN 5.15），跟着每次 push 跑只会得到时绿时红的门禁。
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: [self-hosted, gpu]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 性能回归（对照同机基线）
        run: |
          python -m benchmarks.run --backend cuda \
            --check benchmarks/baseline_cuda.json --max-slowdown 0.25
      - name: 单算子调优往返（交替 A/B 搜索 + 应用后逐位对拍）
        run: |
          python -m benchmarks.tune --backend cuda --rounds 2 \
            --save tuning_cuda.json
          python -m benchmarks.tune --backend cuda --apply tuning_cuda.json
      - name: 恢复趋势历史
        uses: actions/cache/restore@v4
        with:
          path: telemetry_history.json
          # key 每次不同（cache 不可变），restore-keys 按前缀取最近一次
          key: telemetry-cuda-${{ github.run_id }}
          restore-keys: |
            telemetry-cuda-
      - name: 吞吐 / 显存趋势（接上历史，每张图留最近 200 条）
        run: |
          if [ -f telemetry_history.json ]; then
            python -m benchmarks.trend --backend cuda --rounds 3 \
              --compare telemetry_history.json \
              --save telemetry_history.json --prune 200
          else
            python -m benchmarks.trend --backend cuda --rounds 3 \
              --save telemetry_history.json --prune 200
          fi
      - name: 保存趋势历史
        uses: actions/cache/save@v4
        with:
          path: telemetry_history.json
          key: telemetry-cuda-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu-reports
          path: |
            tuning_cuda.json
            telemetry_cuda.json
            telemetry_history.json
          if-no-files-found: ignore

  publish:
    name: 发布到 PyPI（v* tag）
    # 只在打 tag 时发布：普通 push 与 PR 都不该持有发布权限。
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, cpu, frontend, build, fuzz]
    runs-on: ubuntu-latest
    permissions:
      # PyPI trusted publishing：用 OIDC 换短期令牌，不存长期密码。
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装构建依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy build
      # tag 与包版本错配时，PyPI 上会出现"tag 写 v0.2.0、发出去的是 0.1.0"。
      # 在构建前拦住，比发布后 yank 便宜。
      - name: 校验 tag 与 __version__ 一致
        run: |
          python - <<'PY'
          import os
          import aetherflow
          tag = os.environ["GITHUB_REF_NAME"]
          expected = tag[1:] if tag.startswith("v") else tag
          assert expected == aetherflow.__version__, (
              f"tag {tag} 与包版本 {aetherflow.__version__} 不一致"
          )
          print("version ok:", aetherflow.__version__)
          PY
      - name: 构建 sdist 与 wheel
        run: python -m build
      - name: 上传到 PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
